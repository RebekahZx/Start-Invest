[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "start-invest"
version = "0.3.0"
description = "Personalised startup-investment feed: success prediction, thesis matching, learning-to-rank and explanations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shrinivas Anavekar"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
start-invest-train = "start_invest.cli:main"
start-invest-export-demo = "start_invest.export_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
markers = ["e2e: browser tests against a live server (RUN_E2E=1)"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731", "RUF001", "RUF002", "B904"]
