[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-match"
version = "0.2.0"
description = "Personalised startup-investment feed: success prediction, thesis matching, learning-to-rank and explanations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shrinivas Anavekar"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
startup-match-train = "startup_match.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
